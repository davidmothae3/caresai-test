<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARES — Climate Anticipatory Risk & Early Warning System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#003366;--blue:#0077CC;
  --high:#CC2200;--high-bg:#fff0ee;--high-bd:#ffcfc9;
  --med:#FF8800;--med-bg:#fff8ee;--med-bd:#ffd9a0;
  --low:#22AA44;--low-bg:#edfff3;--low-bd:#a0e8b8;
  --bg:#F4F7FA;--panel:#FFFFFF;
  --text:#1A1A2E;--text2:#444466;--text3:#666688;
  --bd:#DDE3EC;--bd2:#C8D0DC;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden;}
.app{display:grid;grid-template-rows:54px 1fr;height:100vh;}

/* TOPBAR */
.topbar{background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:1000;}
.tl{display:flex;align-items:center;gap:11px;}
.logo{width:32px;height:32px;background:#C9A84C;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--navy);}
.bm{font-size:15px;font-weight:700;color:#fff;}
.bs{font-size:10px;color:rgba(255,255,255,0.55);letter-spacing:1.2px;text-transform:uppercase;}
.tabs{display:flex;gap:3px;}
.tab{padding:5px 14px;border-radius:5px;border:1px solid transparent;background:transparent;color:rgba(255,255,255,0.6);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.18s;}
.tab:hover{color:#fff;border-color:rgba(255,255,255,0.2);}
.tab.active{background:rgba(255,255,255,0.13);color:#fff;border-color:rgba(255,255,255,0.25);}
.tr{display:flex;align-items:center;gap:9px;}
.tbadge{padding:3px 9px;border-radius:20px;font-size:11px;font-family:var(--mono);}
.gold{background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.4);color:#C9A84C;}
.green{background:rgba(34,170,68,0.12);border:1px solid rgba(34,170,68,0.3);color:#22AA44;}
.ldot{width:6px;height:6px;background:#22AA44;border-radius:50%;display:inline-block;margin-right:4px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* CONTENT */
#content{overflow:hidden;height:100%;}

/* MAP LAYOUT — v2 style: left list | center map | right detail */
.map-layout{display:grid;grid-template-columns:260px 1fr 320px;height:100%;overflow:hidden;}

/* LEFT PANEL */
.left-panel{background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;}
.lp-header{padding:12px 14px 9px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.lp-title{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:1.1px;text-transform:uppercase;}
.lp-count{font-size:11px;font-family:var(--mono);color:var(--text3);}
.dist-list{overflow-y:auto;flex:1;padding:7px;}
.dist-list::-webkit-scrollbar{width:4px;}
.dist-list::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}
.dc{padding:10px 11px;border-radius:7px;border:1px solid transparent;cursor:pointer;transition:all 0.14s;margin-bottom:3px;display:flex;align-items:center;gap:9px;}
.dc:hover{background:var(--bg);border-color:var(--bd);}
.dc.active{background:#EEF4FF;border-color:var(--blue);}
.rpill{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.rpill.High{background:var(--high);box-shadow:0 0 5px var(--high)88;}
.rpill.Medium{background:var(--med);box-shadow:0 0 5px var(--med)88;}
.rpill.Low{background:var(--low);box-shadow:0 0 5px var(--low)88;}
.di{flex:1;min-width:0;}
.dn{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dm{font-size:10px;color:var(--text3);margin-top:2px;}
.sbar-w{height:2px;background:var(--bd);border-radius:1px;margin-top:5px;}
.sbar{height:100%;border-radius:1px;}
.sbar.High{background:var(--high);}
.sbar.Medium{background:var(--med);}
.sbar.Low{background:var(--low);}
.ds{text-align:right;flex-shrink:0;}
.snum{font-size:17px;font-weight:700;font-family:var(--mono);line-height:1;}
.snum.High{color:var(--high);}
.snum.Medium{color:var(--med);}
.snum.Low{color:var(--low);}
.slvl{font-size:9px;color:var(--text3);margin-top:2px;letter-spacing:0.4px;}

/* MAP CENTER */
.map-wrap{position:relative;}
#map{width:100%;height:100%;}
.map-legend{position:absolute;bottom:16px;left:10px;z-index:500;background:rgba(255,255,255,0.96);border:1px solid var(--bd);border-radius:7px;padding:9px 13px;box-shadow:0 2px 8px rgba(0,0,0,0.09);}
.mlt{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;}
.mlr{display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:11px;color:var(--text2);}
.mls{width:14px;height:10px;border-radius:2px;}
.map-badge{position:absolute;top:10px;right:10px;z-index:500;background:rgba(255,255,255,0.96);border:1px solid var(--bd);border-radius:7px;padding:7px 11px;font-size:11px;color:var(--text3);font-family:var(--mono);text-align:right;box-shadow:0 2px 6px rgba(0,0,0,0.07);}
.facility-toggle-group{position:absolute;bottom:16px;right:10px;z-index:500;display:flex;gap:6px;}
.facility-toggle{background:rgba(255,255,255,0.96);border:1px solid var(--bd);border-radius:7px;padding:8px 12px;font-size:11px;font-family:var(--font);color:var(--text2);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.09);display:flex;align-items:center;gap:6px;}
.facility-toggle.active-toggle{background:var(--navy);color:#fff;border-color:var(--navy);}
.ft-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:2px;}
.ft-dot.health{background:#CC2200;}
.ft-dot.school{background:#0077CC;}
.fclust{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;width:30px;height:30px;box-shadow:0 2px 6px rgba(0,0,0,0.25);border:2px solid #fff;}
.fclust.health{background:#CC2200;}
.fclust.school{background:#0077CC;}
.map-badge span{color:var(--navy);font-weight:600;}

/* RIGHT DETAIL PANEL */
.right-panel{background:var(--panel);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;}
.rp-header{padding:13px 14px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.rp-name{font-size:17px;font-weight:700;color:var(--navy);}
.rp-sub{font-size:11px;color:var(--text3);margin-top:3px;}
.back-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--blue);cursor:pointer;padding:4px 0;font-weight:500;margin-bottom:6px;}
.rp-body{overflow-y:auto;flex:1;padding:11px 13px;}
.rp-body::-webkit-scrollbar{width:4px;}
.rp-body::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}

/* SECTION LABEL */
.slabel{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:1.1px;text-transform:uppercase;margin:11px 0 6px;}
.slabel:first-child{margin-top:0;}

/* RISK BADGE */
.rbadge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:0.4px;}
.rbadge.High{background:var(--high-bg);color:var(--high);border:1px solid var(--high-bd);}
.rbadge.Medium{background:var(--med-bg);color:var(--med);border:1px solid var(--med-bd);}
.rbadge.Low{background:var(--low-bg);color:var(--low);border:1px solid var(--low-bd);}

/* METRICS */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.mbox{padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;}
.mlabel{font-size:9px;color:var(--text3);letter-spacing:0.7px;text-transform:uppercase;margin-bottom:3px;}
.mval{font-size:15px;font-weight:700;font-family:var(--mono);}
.munit{font-size:9px;color:var(--text3);font-family:var(--font);}

/* WEATHER COMPACT */
.wx-compact{background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:8px 10px;margin-bottom:5px;}
.wx-row{display:flex;gap:4px;margin-top:5px;}
.wx-day{flex:1;text-align:center;background:#fff;border:1px solid var(--bd);border-radius:4px;padding:4px 2px;}
.wx-date{font-size:8px;color:var(--text3);margin-bottom:2px;}
.wx-mm{font-size:11px;font-weight:700;font-family:var(--mono);color:var(--blue);}

/* DRIVERS */
.dbox{padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;margin-bottom:5px;}
.drank{font-size:9px;color:var(--text3);letter-spacing:0.4px;margin-bottom:2px;}
.dname{font-size:12px;font-weight:600;color:var(--text);}
.dbar-w{height:3px;background:var(--bd);border-radius:2px;margin-top:5px;}
.dbar{height:100%;border-radius:2px;}

/* ACTION */
.abox{padding:9px 11px;border-radius:5px;font-size:11px;line-height:1.55;margin-bottom:8px;}
.abox.High{background:var(--high-bg);border:1px solid var(--high-bd);}
.abox.Medium{background:var(--med-bg);border:1px solid var(--med-bd);}
.abox.Low{background:var(--low-bg);border:1px solid var(--low-bd);}
.atitle{font-size:9px;font-weight:700;letter-spacing:0.7px;text-transform:uppercase;margin-bottom:4px;}
.abox.High .atitle{color:var(--high);}
.abox.Medium .atitle{color:var(--med);}
.abox.Low .atitle{color:var(--low);}

/* TREND CHART */
.chart-wrap{background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:8px;margin-bottom:8px;}

/* COMMUNITIES */
.crow{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--bd);border-radius:5px;cursor:pointer;transition:all 0.13s;margin-bottom:3px;}
.crow:hover{background:var(--bg);border-color:var(--blue);}
.crow.open{background:var(--bg);border-color:var(--navy);border-bottom-left-radius:0;border-bottom-right-radius:0;}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.cname{flex:1;font-size:12px;font-weight:500;}
.cscore{font-family:var(--mono);font-weight:700;font-size:12px;}
.cdetail{display:none;padding:9px;background:var(--bg);border:1px solid var(--bd);border-top:none;border-radius:0 0 5px 5px;margin-bottom:3px;}
.cdetail.open{display:block;}
.cmgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:7px;}
.cmb{padding:5px 7px;background:#fff;border:1px solid var(--bd);border-radius:4px;}
.cml{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px;}
.cmv{font-size:12px;font-weight:700;font-family:var(--mono);}
.eflag{display:flex;align-items:flex-start;gap:7px;padding:6px 8px;border-radius:4px;font-size:11px;line-height:1.4;margin-bottom:3px;}
.eflag.warning{background:#fff8ee;border:1px solid var(--med-bd);color:#7a4400;}
.eflag.caution{background:var(--high-bg);border:1px solid var(--high-bd);color:#7a1a00;}
.eflag.info{background:var(--low-bg);border:1px solid var(--low-bd);color:#0a5c22;}
.eflag.pending{background:#f0f4fa;border:1px solid var(--bd);color:var(--text3);}

/* JSON */
.json-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;background:var(--navy);color:#fff;border:none;border-radius:5px;font-family:var(--font);font-size:11px;font-weight:500;cursor:pointer;margin-bottom:8px;}
.jblock{background:#1a1a2e;border-radius:5px;padding:11px;font-family:var(--mono);font-size:10px;line-height:1.65;color:#a8d8a8;overflow-x:auto;white-space:pre;margin-bottom:8px;}
.jk{color:#88bbff;}
.js{color:#ffcc88;}
.jn{color:#88ffcc;}

/* NO SELECTION */
.no-sel{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:9px;color:var(--text3);text-align:center;padding:20px;}

/* DISCLAIMER */
.disc{font-size:10px;color:var(--text3);padding:7px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;line-height:1.5;}

/* FULL TAB */
.ftab{height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.fth{padding:13px 22px;border-bottom:1px solid var(--bd);background:var(--panel);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.ftitle{font-size:14px;font-weight:700;color:var(--navy);}
.fsub{font-size:11px;color:var(--text3);margin-top:2px;}

/* LEAFLET */
.leaflet-container{background:#e8ecf0 !important;}
.leaflet-popup-content-wrapper{background:#fff;border:1px solid var(--bd);border-radius:7px;font-family:var(--font);box-shadow:0 4px 16px rgba(0,0,0,0.1);}
.leaflet-popup-content{margin:11px 13px;font-size:12px;color:var(--text);}
.pt{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:5px;}
.pr{display:flex;justify-content:space-between;gap:12px;margin:2px 0;color:var(--text3);}
.pr span{color:var(--text);font-family:var(--mono);font-weight:600;}
.leaflet-control-attribution{display:none;}
.leaflet-control-zoom a{background:#fff !important;border-color:var(--bd) !important;color:var(--navy) !important;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}


/* ── MOBILE BOTTOM SHEET ───────────────────────────────── */
@media (max-width: 768px) {
  .bottom-sheet {
    position: fixed;
    bottom: 56px; left: 0; right: 0;
    background: var(--panel);
    border-radius: 16px 16px 0 0;
    border-top: 2px solid var(--bd);
    box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
    z-index: 1500;
    max-height: 80vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  .bottom-sheet.open {
    transform: translateY(0);
  }
  .bs-handle {
    display: flex;
    justify-content: center;
    padding: 10px 0 4px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .bs-handle-bar {
    width: 36px; height: 4px;
    background: var(--bd2);
    border-radius: 2px;
  }
  .bs-close-tap {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: calc(20vh);
    z-index: 1400;
    display: none;
  }
  .bs-close-tap.active { display: block; }

  /* Hide desktop right panel on mobile */
  .map-layout .right-panel { display: none; }
  /* Override map layout for mobile */
  .map-layout {
    grid-template-columns: 1fr !important;
    grid-template-rows: 180px 1fr !important;
  }
  .left-panel {
    max-height: 180px;
    border-right: none;
    border-bottom: 1px solid var(--bd);
    overflow: hidden;
  }
  .map-wrap { min-height: 300px; }
}
@media (min-width: 769px) {
  .bottom-sheet { display: none !important; }
  .bs-close-tap { display: none !important; }
}

/* ── MOBILE RESPONSIVE ─────────────────────────────── */
@media (max-width: 768px) {
  .topbar { padding: 0 12px; }
  .tabs { display: none; }
  .tr { gap: 6px; }
  .tbadge { display: none; }
  .topbar .tr span:last-child { font-size: 10px; }

  /* Map layout: stack vertically on mobile */
  .map-layout {
    grid-template-columns: 1fr !important;
    grid-template-rows: auto 280px auto !important;
  }
  .left-panel {
    max-height: 180px;
    border-right: none;
    border-bottom: 1px solid var(--bd);
  }
  .right-panel {
    border-left: none;
    border-top: 1px solid var(--bd);
    max-height: 400px;
  }
  .map-badge { display: none; }
  .map-legend { padding: 7px 10px; font-size: 11px; }

  /* Full tabs */
  .ftab .fth {
    flex-direction: column;
    gap: 8px;
    padding: 10px 14px;
  }
  .ftab .fth > div:last-child {
    flex-wrap: wrap;
  }
  .full-tab-body {
    grid-template-columns: 1fr !important;
  }

  /* Detail panel */
  .rp-body { padding: 10px; }
  .mgrid { grid-template-columns: 1fr 1fr; gap: 5px; }
  .cmgrid { grid-template-columns: 1fr 1fr; }

  /* Mobile tab bar at bottom */
  .mobile-tabs {
    display: flex !important;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--navy);
    border-top: 1px solid rgba(255,255,255,0.1);
    z-index: 2000;
    padding: 0;
  }
  .mobile-tab-btn {
    flex: 1;
    padding: 10px 4px 8px;
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.55);
    font-family: var(--font);
    font-size: 10px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: color 0.15s;
  }
  .mobile-tab-btn.active { color: #C9A84C; }
  .mobile-tab-btn .mti { font-size: 16px; }

  /* Add padding to content for fixed mobile tabs */
  #content { padding-bottom: 56px; }
}

@media (min-width: 769px) {
  .mobile-tabs { display: none !important; }
}
</style>
</head>
<body>
<div class="app">
<div class="topbar">
  <div class="tl">
    <img src="https://titaniumxgroup.com/wp-content/uploads/2026/05/cares-logo.png" style="height:58px;width:auto;object-fit:contain;margin-top:-4px;" alt="CARES">
    <div><div class="bm">CARES</div><div class="bs">Climate Anticipatory Risk & Early Warning System</div></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="map">District Risk Map</button>
    <button class="tab" data-tab="trend">Trend Analysis</button>
    <button class="tab" data-tab="alerts">Alert Feed</button>
  </div>
  <div class="tr">
    <span class="tbadge gold">14-Day Forecast Window</span>
    <span class="tbadge green">Prototype · Notional Data</span>
    <span style="font-size:11px;color:rgba(255,255,255,0.45);font-family:var(--mono);">CARE-AI v1.0</span>
  </div>
</div>
<div id="content"></div>
</div>

<script>
const HIGH='#CC2200',MED='#FF8800',LOW='#22AA44';
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// OWM key restricted to authorised domains (titaniumxgroup.github.io + localhost) via OWM account settings
// Sprint 2: move to server-side proxy or Cloudflare Worker — documented trade-off for MVP
const OWM='7e9cbe503d5de58fa2865be789576d4a';

function drivers(name){

  return[

// ── WEATHER ────────────────────────────────────────────
async function fetchWx(name){
  if(wData[name]) return;
  const co=COORDS[name]; if(!co) return;
  try{
    const r=await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${co.lat}&lon=${co.lon}&appid=${OWM}&units=metric`);
    const data=await r.json();
    if(data.list){
      const byDay={};
      data.list.forEach(item=>{
        const day=item.dt_txt.slice(0,10);
        if(!byDay[day]) byDay[day]=0;
        byDay[day]+=((item.rain&&item.rain['3h'])||0);
      });
      const days=Object.keys(byDay).sort().slice(0,5);
      wData[name]={days,mm:days.map(d=>+byDay[d].toFixed(1)),total:+days.reduce((s,d)=>s+byDay[d],0).toFixed(1)};
    }
  }catch(e){wData[name]={error:true};}
}
async function fetchAllWx(){await Promise.all(Object.keys(COORDS).map(n=>fetchWx(n)));}

function renderWx(name){
  const el=document.getElementById('wx-sec'); if(!el) return;
  const w=wData[name];
  if(!w||w.error){el.innerHTML=`<div class="wx-compact"><span style="font-size:10px;color:var(--text3)">⟳ Loading simulated forecast…</span></div>`;return;}
  el.innerHTML=`<div class="wx-compact">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:10px;font-weight:600;color:var(--navy)">14-Day Rainfall</span>
      <span style="font-size:10px;font-family:var(--mono);color:var(--blue)">Total: ${w.total}mm</span>
    </div>
    <div class="wx-row">
      ${w.days.map((d,i)=>`<div class="wx-day"><div class="wx-date">${d.slice(5)}</div><div class="wx-mm">${w.mm[i]}</div></div>`).join('')}
    </div>
  </div>`;
}

function initMap(){
  lmap=L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([-29.5,28.3],7);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'',maxZoom:19}).addTo(lmap);
  gjLayer=L.geoJSON(GEO,{
    style:f=>distStyle(f.properties.name),
    onEachFeature:(f,layer)=>{
      const nm=f.properties.name;
      const d=CD.districts[nm]; if(!d) return;
      layer.bindTooltip(`<strong>${nm}</strong><br><span style="color:${C(d.risk_level)}">${d.risk_level} Risk</span> — Score ${d.risk_score}`,{sticky:true});
      layer.on({
        mouseover(e){if(selDist!==nm) e.target.setStyle({fillOpacity:0.88,weight:2.5});},
        mouseout(e){if(selDist!==nm) gjLayer.resetStyle(e.target);},
        click(){openDist(nm);}
      });
    }
  }).addTo(lmap);

  const isMobile = window.innerWidth <= 768;
  const markerRadius = isMobile ? 7 : 5;
  communityLayer = L.layerGroup();
  Object.entries(CD.districts).forEach(([distName, d]) => {
    d.communities.forEach(c => {
      const key = `${c.name}|${distName}`;
      const coord = COMMUNITY_COORDS[key];
      if (!coord) return;
      const isFallback = coord.source === 'approximated_fallback';
      const marker = L.circleMarker([coord.lat, coord.lng], {
        radius: markerRadius,
        fillColor: C(c.risk_level),
        color: isFallback ? '#888' : '#fff',
        weight: isFallback ? 1.5 : 1,
        fillOpacity: isFallback ? 0.55 : 0.9,
        dashArray: isFallback ? '2,2' : null
      });
      marker.bindTooltip(
        `<strong>${c.name}</strong> (${distName})<br>` +
        `<span style="color:${C(c.risk_level)}">${c.risk_level} Risk</span> — Score ${c.risk_score}` +
        (isFallback ? '<br><em style="color:#888;font-size:10px">Approximate location</em>' : ''),
        {sticky: !isMobile}
      );
      marker.on('click', () => {
        openDist(distName);
        if (isMobile) {
          setTimeout(() => {
            const idx = CD.districts[distName].communities.findIndex(cm => cm.name === c.name);
            if (idx >= 0 && typeof toggleBSComm === 'function') toggleBSComm(idx, distName);
          }, 350);
        }
      });
      marker._districtName = distName;
      communityLayer.addLayer(marker);
    });
  });
}

function buildFacilityLayer(){
  if (facilityLayer) return facilityLayer;
  facilityLayer = {
    health: L.markerClusterGroup({
      maxClusterRadius: 45,
      iconCreateFunction: c => L.divIcon({html:`<div class="fclust health">${c.getChildCount()}</div>`, className:'', iconSize:[30,30]})
    }),
    school: L.markerClusterGroup({
      maxClusterRadius: 45,
      iconCreateFunction: c => L.divIcon({html:`<div class="fclust school">${c.getChildCount()}</div>`, className:'', iconSize:[30,30]})
    })
  };
  FACILITIES.forEach(fa => {
    const isSchool = fa.type === 'school';
    const color = isSchool ? '#0077CC' : '#CC2200';
    const marker = L.circleMarker([fa.lat, fa.lng], {
      radius: 5,
      fillColor: color,
      color: '#fff',
      weight: 1,
      fillOpacity: fa.status === 'closed' ? 0.3 : 0.9
    });
    marker.bindTooltip(
      `<strong>${fa.name}</strong><br>${fa.category}` +
      (fa.status !== 'open' ? `<br><em style="color:#888;font-size:10px">${fa.status}</em>` : ''),
      {sticky:true}
    );
    facilityLayer[isSchool ? 'school' : 'health'].addLayer(marker);
  });
  return facilityLayer;
}

let facilityVisible = {health:false, school:false};

function toggleFacilityType(kind){
  if (!facilityLayer) buildFacilityLayer();
  facilityVisible[kind] = !facilityVisible[kind];
  const btn = document.getElementById(`facility-toggle-${kind}`);
  if (facilityVisible[kind]) {
    lmap.addLayer(facilityLayer[kind]);
    if (btn) btn.classList.add('active-toggle');
  } else {
    lmap.removeLayer(facilityLayer[kind]);
    if (btn) btn.classList.remove('active-toggle');
  }
}

function distStyle(name){
  const d=CD.districts[name];
  if(!d) return{fillColor:'#ccc',weight:1.5,color:'#fff',fillOpacity:0.6};
  return{fillColor:C(d.risk_level),weight:1.5,color:'#ffffff',fillOpacity:0.72};
}

function openDist(name){

  if(gjLayer){
    gjLayer.eachLayer(layer=>{
      const n=layer.feature&&layer.feature.properties.name;
      if(n===name){layer.setStyle({fillOpacity:0.35,weight:2.5,color:'#003366'});lmap.fitBounds(layer.getBounds(),{padding:[30,30]});}
      else gjLayer.resetStyle(layer);
    });
  }
  // Community markers — show only this district's
  if (communityLayer) {
    if (!lmap.hasLayer(communityLayer)) communityLayer.addTo(lmap);
    communityLayer.eachLayer(m => {
      const show = m._districtName === name;
      m.setStyle({opacity: show ? 1 : 0, fillOpacity: show ? (m.options.dashArray ? 0.55 : 0.9) : 0});
    });
  }
  buildDetailPanel(name);
}

        <div class="mbox"><div class="mlabel">Children U5</div><div class="mval" style="font-size:13px">${(d.u5_population/1000).toFixed(1)}<span class="munit">k</span></div></div>
      </div>

      <div class="slabel">14-Day Simulated Forecast</div>
      <div id="wx-sec"><div class="wx-compact"><span style="font-size:10px;color:var(--text3)">⟳ Loading simulated forecast…</span></div></div>

      <div class="slabel">Component Breakdown — Top 3 Drivers</div>
      ${drvs.map((dr,i)=>`
        <div class="dbox">
          <div class="drank">Driver ${i+1} · ${dr.l}</div>
          <div class="dname">${dr.n}</div>
          <div class="dbar-w"><div class="dbar" style="width:${(dr.c/mx*100).toFixed(0)}%;background:${i===0?col:'var(--blue)'}"></div></div>
        </div>`).join('')}

      <div class="slabel">Recommended Action</div>
      <div class="abox ${d.risk_level}">
        <div class="atitle">${d.risk_level} Risk Protocol</div>
        ${action(d.risk_level)}
      </div>

      <div class="slabel">2024 Monthly Trend</div>
      <div class="chart-wrap" style="height:80px"><canvas id="tchart"></canvas></div>

      <div class="slabel">Communities (${d.communities.length})</div>
      ${d.communities.map((c,i)=>`
        <div id="cr${i}">
          <div class="crow" onclick="toggleC(${i},'${name}')">
            <div class="cdot" style="background:${C(c.risk_level)}"></div>
            <span class="cname">${c.name}</span>
            <span style="font-size:10px;color:var(--text3);margin-right:5px">${c.u5_pop.toLocaleString()}</span>
            <span class="cscore" style="color:${C(c.risk_level)}">${c.risk_score}</span>

        </div>`).join('')}

      <div style="height:10px"></div>

    });

  if(wData[name]) renderWx(name);
  else fetchWx(name).then(()=>renderWx(name));

function backToOverview(){
  selDist=null;
  if(gjLayer) gjLayer.eachLayer(l=>gjLayer.resetStyle(l));
  if (communityLayer && lmap.hasLayer(communityLayer)) lmap.removeLayer(communityLayer);
  lmap.setView([-29.5,28.3],7);
  const rp=document.getElementById('right-panel');
  rp.innerHTML=`<div class="no-sel"><div style="font-size:28px;opacity:0.25">⬡</div><div style="font-size:13px;font-weight:600;color:var(--text2)">Select a District</div><div style="font-size:11px;">Click any district on the map or list to view detail.</div></div>`;

}

  document.querySelectorAll('.cdetail.open').forEach(d=>{d.classList.remove('open');});
  document.querySelectorAll('.crow.open').forEach(d=>{d.classList.remove('open');});
  row.classList.add('open'); det.classList.add('open');
  const c=CD.districts[distName].communities[idx];
  const flags=eflags(c.name);
  det.innerHTML=`
    <div class="cmgrid">
      <div class="cmb"><div class="cml">Diarrhoea</div><div class="cmv" style="color:${c.diarrhoea_rate>400?HIGH:c.diarrhoea_rate>250?MED:LOW}">${c.diarrhoea_rate.toFixed(0)}</div></div>
      <div class="cmb"><div class="cml">ARI</div><div class="cmv" style="color:${c.ari_rate>350?HIGH:c.ari_rate>200?MED:LOW}">${c.ari_rate.toFixed(0)}</div></div>

      <div class="cmb"><div class="cml">Safe Water</div><div class="cmv" style="color:${c.safe_water<75?HIGH:c.safe_water<85?MED:LOW}">${c.safe_water.toFixed(0)}%</div></div>

function showJSON(name){
  const d=CD.districts[name];
  const w=wData[name];
  const drvs=drivers(name);
  const obj={district:d.district,risk_type:"child_climate_health_composite",forecast_window:"next_14_days",risk_score:d.risk_score,risk_level:d.risk_level,main_drivers:drvs.map(dr=>dr.n),recommended_action:action(d.risk_level),rainfall_forecast_mm:w&&!w.error?w.total:"pending",data_sources:["CARES_notional_DHS_anchored_dataset","OpenWeatherMap_API"],generated_at:new Date().toISOString(),model_version:"care-ai-v1.0",confidence_note:"Indicative MVP output — subject to human review"};
  const str=JSON.stringify(obj,null,2).replace(/"([^"]+)":/g,'<span class="jk">"$1"</span>:').replace(/: "([^"]+)"/g,': <span class="js">"$1"</span>').replace(/: (\d+\.?\d*)/g,': <span class="jn">$1</span>');
  const rb=document.querySelector('.rp-body'); if(!rb) return;

// ── TREND TAB ──────────────────────────────────────────
function renderTrend(c){
  const names=Object.keys(CD.trends);
  const pal=['#CC2200','#FF8800','#22AA44','#0077CC','#8833CC','#CC6600','#008888','#880044','#446600','#004488'];
  const dc={};names.forEach((d,i)=>dc[d]=pal[i]);
  const active=new Set(names);
  c.innerHTML=`
    <div class="ftab">
      <div class="fth">
        <div><div class="ftitle">2024 Risk Score Trends — All Districts</div><div class="fsub">Monthly composite · Jan–Dec 2024 · Dashed: High ≥70, Medium ≥45</div></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;max-width:500px;" id="togg"></div>
      </div>
      <div style="flex:1;display:grid;grid-template-columns:1fr 260px;overflow:hidden;">
        <div style="padding:14px;overflow:hidden;display:flex;flex-direction:column;">
          <div style="background:#fff;border:1px solid var(--bd);border-radius:7px;padding:12px;flex:1;min-height:0;">
            <canvas id="mc"></canvas>
          </div>
        </div>
        <div style="border-left:1px solid var(--bd);background:#fff;overflow-y:auto;padding:12px;" id="ts"></div>
      </div>
    </div>`;
  const tg=document.getElementById('togg');
  names.forEach(d=>{
    const b=document.createElement('button');
    b.style.cssText=`padding:3px 9px;border-radius:11px;border:1px solid ${dc[d]}55;background:${dc[d]}15;color:${dc[d]};font-size:11px;font-family:var(--font);cursor:pointer;font-weight:500;`;
    b.textContent=d;
    b.addEventListener('click',()=>{active.has(d)?(active.delete(d),b.style.opacity='0.3'):(active.add(d),b.style.opacity='1');upd();});
    tg.appendChild(b);
  });
  const tp={id:'t',afterDraw(ch){
    const{ctx:cx,chartArea:{left,right},scales:{y}}=ch;
    [[70,HIGH],[45,MED]].forEach(([v,col])=>{
      const yp=y.getPixelForValue(v);
      cx.save();cx.strokeStyle=col+'66';cx.lineWidth=1;cx.setLineDash([5,4]);
      cx.beginPath();cx.moveTo(left,yp);cx.lineTo(right,yp);cx.stroke();
      cx.fillStyle=col;cx.font='9px DM Mono';cx.fillText(v===70?'HIGH':'MEDIUM',right-46,yp-3);
      cx.restore();
    });
  }};
  const ctx=document.getElementById('mc').getContext('2d');
  if(mChart){try{mChart.destroy();}catch(e){}}
  mChart=new Chart(ctx,{type:'line',data:{labels:MONTHS,datasets:names.map(d=>({label:d,data:CD.trends[d],borderColor:dc[d],backgroundColor:'transparent',borderWidth:2,tension:0.4,pointRadius:2,pointBackgroundColor:dc[d]}))},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(0,51,102,0.95)',callbacks:{label:c=>` ${c.dataset.label}: ${c.raw} (${RL(c.raw)})`}}},scales:{x:{grid:{display:false},ticks:{color:'#666688',font:{size:10,family:'DM Mono'}}},y:{min:0,max:100,grid:{color:'rgba(0,0,0,0.04)'},ticks:{color:'#666688',font:{size:10,family:'DM Mono'}}}}},plugins:[tp]});
  function upd(){mChart.data.datasets.forEach(ds=>{ds.hidden=!active.has(ds.label);});mChart.update();stats();}
  function stats(){
    const el=document.getElementById('ts');if(!el)return;
    const rows=names.filter(d=>active.has(d)).map(d=>{
      const t=CD.trends[d];
      const avg=(t.reduce((a,b)=>a+b,0)/t.length).toFixed(1);
      const max=Math.max(...t),cur=t[11],delta=(cur-t[10]).toFixed(1);
      return{d,avg,max,cur,delta,col:dc[d]};
    }).sort((a,b)=>b.cur-a.cur);
    el.innerHTML=`<div style="font-size:9px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:9px;">Dec 2024</div>
    ${rows.map(s=>`<div style="margin-bottom:6px;padding:8px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;border-left:3px solid ${s.col};">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><span style="font-size:11px;font-weight:600;color:var(--navy)">${s.d}</span><span style="font-size:14px;font-weight:700;font-family:var(--mono);color:${s.cur>=70?HIGH:s.cur>=45?MED:LOW}">${s.cur}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;font-size:10px;">
        <div style="color:var(--text3)">Avg<br><span style="color:var(--text);font-family:var(--mono)">${s.avg}</span></div>
        <div style="color:var(--text3)">Peak<br><span style="color:${HIGH};font-family:var(--mono)">${s.max}</span></div>
        <div style="color:var(--text3)">Δ<br><span style="color:${parseFloat(s.delta)>0?HIGH:LOW};font-family:var(--mono)">${parseFloat(s.delta)>0?'+':''}${s.delta}</span></div>
      </div>
    </div>`).join('')}`;
  }
  stats();
}

function renderAlerts(c){

  const times=[4,12,18,27,35,41,55,67,78,94];

    <div class="ftab">

        <div style="display:flex;gap:7px;">
          <span style="padding:3px 11px;border-radius:11px;background:var(--high-bg);border:1px solid var(--high-bd);font-size:11px;color:var(--high);font-family:var(--mono);">${dists.filter(d=>d.risk_level==='High').length} HIGH</span>

        <div style="overflow-y:auto;padding:12px;border-right:1px solid var(--bd);">
          ${dists.map((d,i)=>{
            const col=C(d.risk_level);const drvs=drivers(d.district);
            const w=wData[d.district];const wt=w&&!w.error?`${w.total}mm`:w&&w.error?'N/A':'…';
            return `<div style="margin-bottom:9px;padding:13px;background:#fff;border:1px solid var(--bd);border-radius:9px;border-left:3px solid ${col};">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;">
                <div>
                  <div style="font-size:14px;font-weight:700;color:var(--navy)">${d.district}</div>
                  <span class="rbadge ${d.risk_level}" style="margin-top:3px;display:inline-block">${d.risk_level.toUpperCase()}</span>
                  ${d.highland?'<span style="margin-left:5px;font-size:10px;color:var(--text3)">⛰</span>':''}
                </div>
                <div style="text-align:right;">
                  <div style="font-size:22px;font-weight:700;font-family:var(--mono);color:${col};line-height:1">${d.risk_score.toFixed(0)}</div>
                  <div style="font-size:10px;color:var(--text3);font-family:var(--mono)">${ta(times[i])}</div>
                </div>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:9px;">
                <div style="padding:6px 8px;background:var(--bg);border-radius:4px;border:1px solid var(--bd);">
                  <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px;">Top Driver</div>
                  <div style="font-size:11px;font-weight:600;color:${col};margin-top:2px;">${drvs[0].n.split(' ').slice(0,2).join(' ')}</div>
                  <div style="font-size:10px;color:var(--text3);font-family:var(--mono)">${drvs[0].l}</div>
                </div>
                <div style="padding:6px 8px;background:var(--bg);border-radius:4px;border:1px solid var(--bd);">
                  <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px;">5-Day Rain</div>
                  <div style="font-size:13px;font-weight:700;font-family:var(--mono);color:var(--blue);margin-top:2px;">${wt}</div>
                </div>
                <div style="padding:6px 8px;background:var(--bg);border-radius:4px;border:1px solid var(--bd);">

              </div>
            </div>`;}).join('')}
        </div>
        <div style="overflow-y:auto;padding:12px;background:#fff;" id="wx-panel">
          <div style="font-size:9px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:9px;">Live 14-Day Rainfall</div>
          ${dists.map(d=>{
            const w=wData[d.district];
            const total=w&&!w.error?`${w.total}mm`:w&&w.error?'N/A':'…';
            const col=w&&!w.error?(w.total>80?HIGH:w.total>40?MED:LOW):C(d.risk_level);

        </div>
      </div>
    </div>`;
  // Weather loads async — UI updates when data arrives without re-render
  fetchAllWx();
}

// ── ASYNC INIT ─────────────────────────────────────────
// Sprint 2: move OWM key to server-side proxy — exposed in public repo, documented trade-off
async function init() {
  try {
    const response = await fetch('care_ai_output.json');
    if (!response.ok) throw new Error('JSON not found');
    const liveData = await response.json();
    buildDashboard(liveData);
  } catch (e) {
    console.warn('care_ai_output.json not found or failed — using notional dataset:', e.message);
    buildDashboard(HARDCODED_CD);
  }
}

function buildDashboard(data) {
  CD = data;
  render();
  fetchAllWx();
}

init();
</script>

<!-- Mobile Bottom Sheet -->
<div class="bs-close-tap" id="bs-close-tap" onclick="closeBottomSheet()"></div>
<div class="bottom-sheet" id="bottom-sheet">
  <div class="bs-handle" onclick="closeBottomSheet()">
    <div class="bs-handle-bar"></div>
  </div>
  <div id="bs-content"></div>
</div>

<script>
function openBottomSheet(name) {
  if (window.innerWidth > 768) return;
  const bs = document.getElementById('bottom-sheet');
  const bsc = document.getElementById('bs-content');
  const tap = document.getElementById('bs-close-tap');
  const d = CD.districts[name];
  const col = d.risk_level === 'High' ? '#CC2200' : d.risk_level === 'Medium' ? '#FF8800' : '#22AA44';
  const drvs = drivers(name);
  const trend = CD.trends[name];

  bsc.innerHTML = `
    <div style="padding:0 14px 80px;">

      <!-- Header -->
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
        <div>
          <div style="font-size:18px;font-weight:700;color:var(--navy)">${d.district}</div>
          <div style="margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span class="rbadge ${d.risk_level}">${d.risk_level.toUpperCase()} — ${d.risk_score.toFixed(0)}</span>
            <span style="font-size:10px;color:var(--text3)">${d.highland ? '⛰ Highland' : '🌾 Lowland'}</span>
          </div>
          <div style="font-size:11px;color:var(--text3);margin-top:4px;">${d.u5_population.toLocaleString()} children U5 · ${d.communities.length} communities</div>
        </div>
        <button onclick="closeBottomSheet()" style="background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--text2);cursor:pointer;flex-shrink:0;">✕</button>
      </div>

      <!-- Metrics -->
      <div style="font-size:9px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">Key Metrics</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:12px;">
        <div style="padding:7px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;text-align:center;">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase;">Diarrhoea</div>
          <div style="font-size:15px;font-weight:700;font-family:var(--mono);color:${d.diarrhoea_rate>400?'#CC2200':d.diarrhoea_rate>250?'#FF8800':'#22AA44'}">${d.diarrhoea_rate.toFixed(0)}</div>
          <div style="font-size:9px;color:var(--text3)">/1k</div>
        </div>
        <div style="padding:7px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;text-align:center;">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase;">Rainfall</div>
          <div style="font-size:15px;font-weight:700;font-family:var(--mono);color:var(--blue)">${d.rainfall.toFixed(0)}</div>
          <div style="font-size:9px;color:var(--text3)">mm</div>
        </div>
        <div style="padding:7px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;text-align:center;">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase;">Safe Water</div>
          <div style="font-size:15px;font-weight:700;font-family:var(--mono);color:${d.safe_water<75?'#CC2200':d.safe_water<85?'#FF8800':'#22AA44'}">${d.safe_water.toFixed(0)}</div>
          <div style="font-size:9px;color:var(--text3)">%</div>
        </div>
        <div style="padding:7px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;text-align:center;">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase;">ARI Rate</div>
          <div style="font-size:15px;font-weight:700;font-family:var(--mono);color:${d.ari_rate>350?'#CC2200':d.ari_rate>200?'#FF8800':'#22AA44'}">${d.ari_rate.toFixed(0)}</div>
          <div style="font-size:9px;color:var(--text3)">/1k</div>
        </div>
        <div style="padding:7px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;text-align:center;">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase;">Temp</div>
          <div style="font-size:15px;font-weight:700;font-family:var(--mono);color:var(--text)">${d.temp.toFixed(1)}</div>
          <div style="font-size:9px;color:var(--text3)">°C</div>
        </div>
        <div style="padding:7px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;text-align:center;">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase;">U5 Pop</div>
          <div style="font-size:15px;font-weight:700;font-family:var(--mono);color:var(--navy)">${(d.u5_population/1000).toFixed(1)}</div>
          <div style="font-size:9px;color:var(--text3)">k</div>
        </div>
      </div>

      <!-- Drivers -->
      <div style="font-size:9px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">Component Breakdown — Top 3 Drivers</div>
      ${drvs.map((dr,i) => `
        <div style="padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;margin-bottom:4px;">
          <div style="font-size:9px;color:var(--text3);">Driver ${i+1} · ${dr.l}</div>
          <div style="font-size:12px;font-weight:600;color:var(--text);margin:2px 0">${dr.n}</div>
          <div style="height:3px;background:var(--bd);border-radius:2px;">
            <div style="height:100%;width:${(dr.c/drvs[0].c*100).toFixed(0)}%;background:${i===0?col:'var(--blue)'};border-radius:2px;"></div>
          </div>
        </div>`).join('')}

      <!-- Action -->
      <div style="margin-top:10px;padding:9px 11px;border-radius:5px;font-size:11px;line-height:1.6;background:${d.risk_level==='High'?'#fff0ee':d.risk_level==='Medium'?'#fff8ee':'#edfff3'};border:1px solid ${col}33;margin-bottom:12px;">
        <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:${col};margin-bottom:4px;">${d.risk_level} Risk Protocol</div>
        ${action(d.risk_level)}
      </div>

      <!-- Trend chart -->
      <div style="font-size:9px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">2024 Monthly Trend</div>
      <div style="background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:8px;margin-bottom:12px;height:90px;">
        <canvas id="bs-trend-chart"></canvas>
      </div>

      <!-- Communities -->
      <div style="font-size:9px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">Communities (${d.communities.length})</div>
      ${d.communities.map((c,i) => `
        <div id="bscr${i}">
          <div style="display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--bd);border-radius:5px;cursor:pointer;margin-bottom:3px;background:#fff;" onclick="toggleBSComm(${i},'${name}')">
            <div style="width:7px;height:7px;border-radius:50%;background:${c.risk_level==='High'?'#CC2200':c.risk_level==='Medium'?'#FF8800':'#22AA44'};flex-shrink:0;"></div>
            <span style="flex:1;font-size:12px;font-weight:500;">${c.name}</span>
            <span style="font-size:10px;color:var(--text3);margin-right:4px;">${c.u5_pop.toLocaleString()}</span>
            <span style="font-size:12px;font-weight:700;font-family:var(--mono);color:${c.risk_level==='High'?'#CC2200':c.risk_level==='Medium'?'#FF8800':'#22AA44'}">${c.risk_score}</span>
            <span style="font-size:10px;color:var(--text3);margin-left:3px;">▾</span>
          </div>
          <div id="bscd${i}" style="display:none;padding:9px;background:#f8fafc;border:1px solid var(--bd);border-top:none;border-radius:0 0 5px 5px;margin-bottom:3px;">
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:7px;">
              <div style="padding:5px 7px;background:#fff;border:1px solid var(--bd);border-radius:4px;">
                <div style="font-size:9px;color:var(--text3);text-transform:uppercase;">Diarrhoea</div>
                <div style="font-size:12px;font-weight:700;font-family:var(--mono);color:${c.diarrhoea_rate>400?'#CC2200':c.diarrhoea_rate>250?'#FF8800':'#22AA44'}">${c.diarrhoea_rate.toFixed(0)}</div>
              </div>
              <div style="padding:5px 7px;background:#fff;border:1px solid var(--bd);border-radius:4px;">
                <div style="font-size:9px;color:var(--text3);text-transform:uppercase;">ARI</div>
                <div style="font-size:12px;font-weight:700;font-family:var(--mono);color:${c.ari_rate>350?'#CC2200':c.ari_rate>200?'#FF8800':'#22AA44'}">${c.ari_rate.toFixed(0)}</div>
              </div>
              <div style="padding:5px 7px;background:#fff;border:1px solid var(--bd);border-radius:4px;">
                <div style="font-size:9px;color:var(--text3);text-transform:uppercase;">Safe H₂O</div>
                <div style="font-size:12px;font-weight:700;font-family:var(--mono);color:${c.safe_water<75?'#CC2200':c.safe_water<85?'#FF8800':'#22AA44'}">${c.safe_water.toFixed(0)}%</div>
              </div>
            </div>
            <div style="font-size:9px;font-weight:600;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:4px;">🏴 Environmental Risk</div>
            ${eflags(c.name).map(f => `<div class="eflag ${f.t}" style="margin-bottom:3px;"><span style="font-size:12px;flex-shrink:0">${f.i}</span><span>${f.x}</span></div>`).join('')}
          </div>
        </div>`).join('')}

      <div style="margin-top:10px;" class="disc">⚠️ Notional DHS-anchored data. Subject to human review. CARE-AI v1.0.</div>
    </div>`;

  bs.classList.add('open');
  tap.classList.add('active');

  // Render trend chart after DOM update
  setTimeout(() => {
    const ctx = document.getElementById('bs-trend-chart');
    if (ctx && trend) {
      const col2 = d.risk_level === 'High' ? '#CC2200' : d.risk_level === 'Medium' ? '#FF8800' : '#22AA44';
      new Chart(ctx.getContext('2d'), {
        type: 'line',
        data: {
          labels: ['J','F','M','A','M','J','J','A','S','O','N','D'],
          datasets: [{
            data: trend,
            borderColor: col2,
            backgroundColor: col2 + '22',
            fill: true,
            tension: 0.4,
            pointRadius: 2,
            borderWidth: 2,
            pointBackgroundColor: trend.map(v => v>=70?'#CC2200':v>=45?'#FF8800':'#22AA44'),
            pointBorderColor: 'transparent'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: true } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#666688', font: { size: 8 } } },
            y: { min: 0, max: 100, grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { color: '#666688', font: { size: 8 } } }
          }
        }
      });
    }
  }, 100);
}

function toggleBSComm(idx, districtName) {
  const det = document.getElementById(`bscd${idx}`);
  if (!det) return;
  const isOpen = det.style.display !== 'none';
  // Close all others
  document.querySelectorAll('[id^="bscd"]').forEach(d => d.style.display = 'none');
  det.style.display = isOpen ? 'none' : 'block';
}

function closeBottomSheet() {
  const bs = document.getElementById('bottom-sheet');
  const tap = document.getElementById('bs-close-tap');
  bs.classList.remove('open');
  tap.classList.remove('active');
}

// Override openDist to also open bottom sheet on mobile
const _origOpenDist = openDist;
openDist = function(name) {
  _origOpenDist(name);
  if (window.innerWidth <= 768) {
    openBottomSheet(name);
  }
};
</script>

</body>
</html>
